<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📴 Control de Apagado PC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        h1 { color: #333; margin-top: 10px; }
        .btn-apagar-todo { background-color: #d9534f; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; width: 100%; }
        .btn-apagar-todo:hover { background-color: #c9302c; }
        .pc-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; text-align: left; }
        .status-online { color: #5cb85c; font-weight: bold; }
        .status-offline { color: #777; font-weight: bold; }
        .btn-individual { background-color: #f0ad4e; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .btn-individual:hover { background-color: #ec971f; }
        .btn-eliminar { background-color: #777; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-left: 5px; }
        .btn-eliminar:hover { background-color: #555; }
        
        /* Nuevos estilos integrados manteniendo el diseño original */
        .stats-container { display: flex; justify-content: space-around; background: #fafafa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; font-size: 16px; font-weight: bold; }
        .info-extra { font-size: 13px; color: #555; display: block; margin-top: 4px; font-weight: normal; }
        
        /* Estilo para la marca del desarrollador ajustado al contenedor y más grande */
        .marca-desarrollador { position: center; top: 15px; right: 20px; font-size: 12px; color: #777; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="marca-desarrollador">© 2026 Desarrollado por Carlos Burgos</div>
    
    <h1>📴 Panel de Control de PC</h1>
    <button class="btn-apagar-todo" onclick="apagarTodas()">🖥️ APAGAR TODAS LAS COMPUTADORAS</button>
    
    <!-- Contadores de Estado -->
    <div class="stats-container">
        <span>Total: <strong id="count-total">0</strong></span>
        <span class="status-online">En Línea: <strong id="count-online">0</strong></span>
        <span class="status-offline">Desconectadas: <strong id="count-offline">0</strong></span>
    </div>

    <div id="lista-pcs">
        <p>Cargando terminales conectadas...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // REEMPLAZA CON LOS DATOS DE TU PROYECTO FIREBASE
    const firebaseConfig = {
        databaseURL: "https://apagadoautomatico-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Escuchar cambios en las PCs conectadas
    const pcsRef = ref(db, 'computadoras');
    onValue(pcsRef, (snapshot) => {
        const data = snapshot.val();
        const listaDiv = document.getElementById('lista-pcs');
        listaDiv.innerHTML = '';

        let totalPCs = 0;
        let onlinePCs = 0;
        let offlinePCs = 0;

        if (!data) {
            listaDiv.innerHTML = '<p>No hay computadoras registradas.</p>';
            actualizarContadores(0, 0, 0);
            return;
        }

        const tiempoActual = Date.now();
        const limiteInactividad = 7 * 24 * 60 * 60 * 1000; // 7 días para mantenimiento automático

        for (let pcId in data) {
            const pc = data[pcId];
            const tiempoInactiva = tiempoActual - pc.ultimaConexion;

            // Mantenimiento Automático: Ocultar si lleva más de 7 días desconectada
            if (tiempoInactiva > limiteInactividad) {
                continue;
            }

            totalPCs++;

            // Verificar si reportó actividad en los últimos 30 segundos
            const esOnline = tiempoInactiva < 30000;
            if (esOnline) {
                onlinePCs++;
            } else {
                offlinePCs++;
            }

            const statusText = esOnline ? '<span class="status-online">En Línea</span>' : '<span class="status-offline">Desconectada</span>';
            
            // Identificación Avanzada
            const usuarioText = pc.usuario ? pc.usuario : 'Usuario desconocido';
            const ipText = pc.ip ? pc.ip : 'Sin IP';

            const pcElement = document.createElement('div');
            pcElement.className = 'pc-card';
            pcElement.innerHTML = `
                <div>
                    <strong>${pcId}</strong> - ${statusText}
                    <span class="info-extra">👤 ${usuarioText} | 🌐 IP: ${ipText}</span>
                </div>
                <div>
                    ${esOnline ? `<button class="btn-individual" onclick="apagarPC('${pcId}')">Apagar</button>` : ''}
                    <button class="btn-eliminar" onclick="eliminarPC('${pcId}')">Eliminar</button>
                </div>
            `;
            listaDiv.appendChild(pcElement);
        }

        actualizarContadores(totalPCs, onlinePCs, offlinePCs);

        if (totalPCs === 0) {
            listaDiv.innerHTML = '<p>No hay computadoras activas recientemente (limpieza aplicada).</p>';
        }
    });

    // Actualiza el panel superior de contadores
    function actualizarContadores(total, online, offline) {
        document.getElementById('count-total').innerText = total;
        document.getElementById('count-online').innerText = online;
        document.getElementById('count-offline').innerText = offline;
    }

    // Función para apagar una PC específica
    window.apagarPC = function(pcId) {
        if(confirm(`¿Estás seguro de que deseas apagar la terminal ${pcId}?`)) {
            const password = prompt("Introduce la contraseña de seguridad para apagar la terminal:");
            if (password === "Oriflame2026") {
                set(ref(db, `computadoras/${pcId}/comando`), "shutdown");
            } else if (password !== null) {
                alert("Contraseña incorrecta. Acción cancelada.");
            }
        }
    }

    // Función para eliminar una PC específica de la lista
    window.eliminarPC = function(pcId) {
        if(confirm(`¿Estás seguro de que deseas eliminar la terminal ${pcId} de la lista?`)) {
            const password = prompt("Introduce la contraseña de seguridad para eliminar la terminal:");
            if (password === "Oriflame2026") {
                set(ref(db, `computadoras/${pcId}`), null);
            } else if (password !== null) {
                alert("Contraseña incorrecta. Acción cancelada.");
            }
        }
    }

    // Función para apagar todo el almacén
    window.apagarTodas = function() {
        if(confirm("¿Estás seguro de que deseas apagar TODAS las computadoras activas de la bodega?")) {
            const password = prompt("Introduce la contraseña de seguridad para proceder con el apagado global:");
            if (password === "Oriflame2026") {
                set(ref(db, 'comando_global'), {
                    accion: "shutdown",
                    timestamp: Date.now()
                });
            } else if (password !== null) {
                alert("Contraseña incorrecta. Acción cancelada.");
            }
        }
    }

    // Bloqueo de Clic Derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloqueo de Atajos de Teclado
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
